# Integración continua de APHIA. No usa secretos ni despliega nada.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"
  NODE_VERSION: "24"

jobs:
  web:
    name: Frontend (TypeScript, Vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aphia/web typecheck
      - run: pnpm --filter @aphia/web test
      - run: pnpm --filter @aphia/web build
        env:
          VITE_API_BASE_URL: http://localhost:8787

  api:
    name: API (Ruff, Pytest unitarias e integración MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        # Credenciales efímeras SOLO para este contenedor de CI (no son secretos reales).
        env:
          MYSQL_ROOT_PASSWORD: ci-root-solo-pruebas
          MYSQL_DATABASE: aphia_test
          MYSQL_USER: aphia_test
          MYSQL_PASSWORD: ci-solo-pruebas
        ports: ["3308:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check . ../../database/scripts
      - run: uv run ruff format --check . ../../database/scripts
      - run: uv run pytest
      - run: uv run pytest -m integration
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3308"
          TEST_DB_NAME: aphia_test
          TEST_DB_USER: aphia_test
          TEST_DB_PASSWORD: ci-solo-pruebas

  files:
    name: Servicio de documentos (Ruff, Pytest, imagen Docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/files
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: docker build -t aphia-files:ci .
      - name: Imagen Docker de la API (producción en el VPS)
        run: docker build -t aphia-api:ci ../api

  worker:
    name: Validación del Worker (pywrangler dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - name: Empaquetar sin desplegar (local, staging y producción)
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run pywrangler deploy --dry-run --outdir dist
          uv run pywrangler deploy --dry-run --outdir dist --env staging
          uv run pywrangler deploy --dry-run --outdir dist --env production

  e2e:
    name: E2E (Playwright → Vite → Python Worker local → MySQL)
    runs-on: ubuntu-latest
    needs: [web, api]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-solo-pruebas
          MYSQL_DATABASE: aphia
          MYSQL_USER: aphia_app
          MYSQL_PASSWORD: ci-solo-pruebas
        ports: ["3307:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      CI: "true"
      DB_HOST: 127.0.0.1
      DB_PORT: "3307"
      DB_NAME: aphia
      DB_USER: aphia_app
      DB_PASSWORD: ci-solo-pruebas
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --project apps/api
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm db:migrate
      - run: pnpm db:seed
      # Secreto efímero del Worker local (AUTH_MODE=database); no es un secreto real.
      - run: printf 'AUTH_SECRET=%s\n' "ci-solo-pruebas-$(openssl rand -hex 24)" > apps/api/.dev.vars
      - run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
