# Integración continua de APHIA. No usa secretos ni despliega nada.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"
  NODE_VERSION: "24"

jobs:
  web:
    name: Frontend (TypeScript, Vitest, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aphia/web typecheck
      - run: pnpm --filter @aphia/web test
      - run: pnpm --filter @aphia/web build
        env:
          VITE_API_BASE_URL: http://localhost:8000

  api:
    name: API (Ruff, Pytest unitarias e integración MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        # Credenciales efímeras SOLO para este contenedor de CI (no son secretos reales).
        env:
          MYSQL_ROOT_PASSWORD: ci-root-solo-pruebas
          MYSQL_DATABASE: aphia_test
          MYSQL_USER: aphia_test
          MYSQL_PASSWORD: ci-solo-pruebas
        ports: ["3308:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check . ../../database/scripts
      - run: uv run ruff format --check . ../../database/scripts
      - run: uv run pytest
      - run: uv run pytest -m integration
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3308"
          TEST_DB_NAME: aphia_test
          TEST_DB_USER: aphia_test
          TEST_DB_PASSWORD: ci-solo-pruebas

  files:
    name: Servicio de documentos (Ruff, Pytest, imagen Docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: docker build -t aphia-files:ci .
      - name: Imagen Docker de la API (producción en el VPS)
        run: docker build -t aphia-api:ci ../api

  e2e:
    name: E2E (Playwright → Vite → API Uvicorn → MySQL)
    runs-on: ubuntu-latest
    needs: [web, api]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-solo-pruebas
          MYSQL_DATABASE: aphia
          MYSQL_USER: aphia_app
          MYSQL_PASSWORD: ci-solo-pruebas
        ports: ["3307:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      CI: "true"
      APP_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: "3307"
      DB_NAME: aphia
      DB_USER: aphia_app
      DB_PASSWORD: ci-solo-pruebas
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      AUTH_MODE: database
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --project apps/api
      # Clave de firma efímera de la API (AUTH_MODE=database); no es un secreto real.
      - run: echo "AUTH_SECRET=ci-solo-pruebas-$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm exec playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
