# Despliegue de la API y del servicio de documentos (Docker en el VPS, por SSH).
# El frontend lo compila y publica Cloudflare Pages por su integración con Git
# (docs/despliegue/cloudflare-pages.md), fuera de este workflow.
#
# - Automático a producción en cada push a main; a mano (Actions → Deploy → Run workflow)
#   para staging o para repetir un despliegue.
# - Ejecuta antes toda la CI.
# - Usa GitHub Environments "staging" y "production". En Settings → Environments configure
#   "Required reviewers" para production si quiere aprobar cada despliegue.
# - Producción solo se despliega desde la rama main.
# - NO ejecuta migraciones: se aplican en el VPS de forma controlada (docs/despliegue/mysql.md).
#
# Configuración requerida por entorno (docs/despliegue/github-actions.md):
#   Secrets:   VPS_SSH_HOST, VPS_SSH_USER, VPS_SSH_KEY, VPS_SSH_KNOWN_HOSTS
#   Variables: API_BASE_URL (URL mostrada en el entorno), VPS_DEPLOY_PATH (opcional, /opt/aphia)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno de destino
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Desplegar en ${{ inputs.environment || 'production' }}
    needs: ci
    if: inputs.environment == 'staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ vars.API_BASE_URL }}
    env:
      VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/aphia' }}
    steps:
      - name: Verificar configuración del entorno
        run: |
          missing=0
          for name in VPS_SSH_HOST VPS_SSH_USER VPS_SSH_KEY VPS_SSH_KNOWN_HOSTS; do
            [ -n "${!name}" ] || { echo "::error::Falta el secreto $name"; missing=1; }
          done
          exit $missing

      # El VPS tiene el repositorio clonado en VPS_DEPLOY_PATH (docs/despliegue/vps.md).
      # Se despliega exactamente el commit que pasó la CI; MySQL no se reinicia.
      - name: Desplegar API y documentos en el VPS (Docker)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_SSH_USER@$VPS_SSH_HOST" \
            "set -e; cd '$VPS_DEPLOY_PATH' && git fetch --quiet origin && git checkout --quiet --detach '$GITHUB_SHA' \
             && cd infra/production && docker compose --env-file .env.production up -d --build api files \
             && docker compose --env-file .env.production ps"

      - name: Comprobar la API publicada
        if: vars.API_BASE_URL != ''
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "${{ vars.API_BASE_URL }}/api/health"
