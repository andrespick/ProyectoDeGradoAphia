# Despliegue de la API (Docker en el VPS, por SSH) y del frontend (Cloudflare Pages).
#
# - Automático a producción en cada push a main; a mano (Actions → Deploy → Run workflow)
#   para staging o para repetir un despliegue.
# - Ejecuta antes toda la CI.
# - Usa GitHub Environments "staging" y "production". En Settings → Environments configure
#   "Required reviewers" para production: el job queda en espera hasta que alguien lo apruebe.
# - Producción solo se despliega desde la rama main.
# - NO ejecuta migraciones: se aplican en el VPS de forma controlada (docs/despliegue/mysql.md).
#
# Configuración requerida por entorno (docs/despliegue/github-actions.md):
#   Secrets:   VPS_SSH_HOST, VPS_SSH_USER, VPS_SSH_KEY, VPS_SSH_KNOWN_HOSTS,
#              CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables: CLOUDFLARE_PAGES_PROJECT, API_BASE_URL, VPS_DEPLOY_PATH (opcional, /opt/aphia)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno de destino
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Desplegar en ${{ inputs.environment || 'production' }}
    needs: ci
    if: inputs.environment == 'staging' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'production' }}
      url: ${{ vars.API_BASE_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
      VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/aphia' }}
    steps:
      - name: Verificar configuración del entorno
        run: |
          missing=0
          for name in VPS_SSH_HOST VPS_SSH_USER VPS_SSH_KEY VPS_SSH_KNOWN_HOSTS CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || { echo "::error::Falta el secreto $name"; missing=1; }
          done
          [ -n "${{ vars.CLOUDFLARE_PAGES_PROJECT }}" ] || { echo "::error::Falta la variable CLOUDFLARE_PAGES_PROJECT"; missing=1; }
          [ -n "${{ vars.API_BASE_URL }}" ] || { echo "::error::Falta la variable API_BASE_URL"; missing=1; }
          exit $missing

      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # El VPS tiene el repositorio clonado en VPS_DEPLOY_PATH (docs/despliegue/vps.md).
      # Se despliega exactamente el commit que pasó la CI; MySQL no se reinicia.
      - name: Desplegar API y documentos en el VPS (Docker)
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$VPS_SSH_USER@$VPS_SSH_HOST" \
            "set -e; cd '$VPS_DEPLOY_PATH' && git fetch --quiet origin && git checkout --quiet --detach '$GITHUB_SHA' \
             && cd infra/production && docker compose --env-file .env.production up -d --build api files \
             && docker compose --env-file .env.production ps"

      - name: Construir frontend
        run: pnpm --filter @aphia/web build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Desplegar frontend (Cloudflare Pages)
        working-directory: apps/api
        run: >
          pnpm exec wrangler pages deploy ../web/dist
          --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT }}"
          --branch "${{ inputs.environment == 'staging' && 'staging' || 'main' }}"
          --commit-dirty=true
