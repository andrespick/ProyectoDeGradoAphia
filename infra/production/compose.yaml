# Producción en el VPS: API (FastAPI/Uvicorn) + MySQL + servicio de documentos.
#
#   cd infra/production
#   docker compose --env-file .env.production up -d --build
#
# Solo la API publica un puerto, y solo en 127.0.0.1:8000: Caddy (instalado en el host) la
# expone por HTTPS. MySQL y el servicio de documentos viven en la red interna "backend" sin
# salida a Internet. El túnel de Cloudflare (perfil "tunnel") es opcional y solo hace falta
# si la API se despliega en Cloudflare Workers.
# Guía completa: docs/despliegue/vps.md
name: aphia

services:
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${DB_NAME:-aphia}
      APHIA_APP_USER: ${DB_APP_USER:-aphia_app}
      APHIA_MIGRATOR_USER: ${DB_MIGRATOR_USER:-aphia_migrator}
      TZ: UTC
    secrets: [mysql_root_password, mysql_app_password, mysql_migrator_password]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${MYSQL_MEMORY_LIMIT:-1200m}
    security_opt:
      - no-new-privileges:true
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  files:
    build:
      context: ../../apps/files
    image: aphia-files:production
    restart: unless-stopped
    environment:
      FILES_SERVICE_TOKEN_FILE: /run/secrets/files_service_token
      FILES_STORAGE_DIR: /data
      FILES_MAX_BYTES: ${FILES_MAX_BYTES:-10485760}
      FILES_ALLOWED_TYPES: ${FILES_ALLOWED_TYPES:-application/pdf,image/png,image/jpeg}
    secrets: [files_service_token]
    volumes:
      - files-data:/data
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
    logging: *logging

  api:
    build:
      context: ../../apps/api
    image: aphia-api:production
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:?Defina CORS_ORIGINS (URL del frontend) en .env.production}
      AUTH_MODE: database
      AUTH_SECRET_FILE: /run/secrets/auth_secret
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-aphia}
      DB_USER: ${DB_APP_USER:-aphia_app}
      DB_PASSWORD_FILE: /run/secrets/mysql_app_password
      DB_SSL_MODE: required
      FILES_SERVICE_URL: http://files:4000
      FILES_SERVICE_TOKEN_FILE: /run/secrets/files_service_token
    secrets: [auth_secret, mysql_app_password, files_service_token]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    # "egress" porque Docker no publica puertos de redes internas.
    networks: [backend, egress]
    depends_on:
      mysql:
        condition: service_healthy
      files:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 384m
    logging: *logging

  # Solo si la API se despliega en Cloudflare Workers (docs/despliegue/tunnel-y-acceso-privado.md):
  #   docker compose --env-file .env.production --profile tunnel up -d
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks: [backend, egress]
    depends_on:
      mysql:
        condition: service_healthy
      files:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128m
    logging: *logging

  # Migraciones controladas (nunca automáticas). Uso, tras un respaldo verificado:
  #   docker compose --env-file .env.production run --rm --build migrator --status
  #   docker compose --env-file .env.production run --rm migrator --confirm-backup
  migrator:
    profiles: [ops]
    build:
      context: ../..
      dockerfile: database/Dockerfile
    image: aphia-migrator:production
    environment:
      APP_ENV: production
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-aphia}
      MIGRATIONS_DB_USER: ${DB_MIGRATOR_USER:-aphia_migrator}
      MIGRATIONS_DB_PASSWORD_FILE: /run/secrets/mysql_migrator_password
      DB_SSL_MODE: required
    secrets: [mysql_migrator_password]
    networks: [backend]
    depends_on:
      mysql:
        condition: service_healthy

networks:
  backend:
    internal: true
  egress: {}

volumes:
  mysql-data:
  files-data:

# Archivos generados en el VPS con scripts/generate-secrets.sh (nunca versionados).
secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  mysql_app_password:
    file: ./secrets/mysql_app_password
  mysql_migrator_password:
    file: ./secrets/mysql_migrator_password
  files_service_token:
    file: ./secrets/files_service_token
  auth_secret:
    file: ./secrets/auth_secret
